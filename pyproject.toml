[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codoc"
version = "0.0.0"
description = "Local Python CLI for documentation in one git repo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["ruff>=0.14"]

[project.scripts]
codoc = "codoc.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.ruff.lint.isort]
known-first-party = ["codoc"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
