[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codoc"
version = "0.0.0"
description = "Local Python CLI for documentation in one git repo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
codoc = "codoc.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.14",
    "zensical>=0.0.74",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.ruff.lint.isort]
known-first-party = ["codoc"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*Tests"]
python_functions = ["test_*"]
