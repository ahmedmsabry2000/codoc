intent: >
  Keep Codoc's own package docs honest: explain the CLI surface for contributors
  and keep an auto-generated package map aligned with the source tree.
audience: Contributors hacking on the Codoc CLI and nearby tooling.
docs:
  - id: index
    type: manual
    path: docs/index.md
    purpose: >
      Landing page for the Codoc package docs—what the CLI does and where the
      getting-started guide, CLI reference, and package overview live.
  - id: guide
    type: hybrid
    path: docs/guides/getting-started.md
    purpose: >
      Walk a contributor through the local develop loop, with an injected
      command table that stays in sync with the CLI.
    placeholders:
      - id: command-table
        script: .codoc/scripts/inject_commands.py
    links:
      - id: cli
        label: CLI reference
      - id: package.overview
        label: Package overview
  - id: cli
    type: manual
    path: docs/reference/cli.md
    purpose: >
      Full user-facing CLI catalog: flags, outputs, exit codes, and command
      behavior for init through clean.
    links:
      - id: guide
        label: Getting started
      - id: package.overview
        label: Package overview
coverage:
  source:
    - id: package
      type: auto-generated
      paths:
        - "**/*.py"
      docs:
        - id: package.overview
          path: docs/reference/package.md
          script: .codoc/scripts/gen_package_overview.py
          canonical: guide
          purpose: >
            Generated reference of Codoc package modules under this scope,
            pointing readers back to the getting-started guide.
          links:
            - id: guide
              label: Getting started
            - id: cli
              label: CLI reference
